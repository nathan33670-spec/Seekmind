# Release bundle of the `ads` variant for the internal testing track of Google Play (validation of
# ticket M4-07: the multilingual pack is only delivered by Play). Manual. Builds both model sets, checked
# against model.lock.json, then the bundle and its checks. If the upload key secrets of
# docs/04-prerequis.md §3 are set, the bundle is signed with the upload key; otherwise the run fails,
# unless `require-signing` is turned off (an unsigned bundle, which Play refuses, for a check only). The
# publication workflow of ticket M11-05 replaces this one.
name: bundle

on:
  workflow_dispatch:
    inputs:
      require-signing:
        description: Fail when the upload key secrets are not set.
        type: boolean
        default: true

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Release bundle (ads)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: bash scripts/setup-android-sdk.sh

      - name: Embedding models
        uses: ./.github/actions/model-artifacts
        with:
          models: fr multi
          install-multi: "true"

      # AdMob ids are not secrets (docs/04-prerequis.md §3): repository variables, Google's test ids when
      # unset. The run number gives each upload a new version code, as Play requires.
      - name: Bundle and its checks
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ vars.ADMOB_REWARDED_UNIT_ID }}
        run: |
          args=(-Pseekmind.versionCode="${GITHUB_RUN_NUMBER}")
          if [ -n "$ADMOB_APP_ID" ]; then args+=(-Pseekmind.admob.appId="$ADMOB_APP_ID"); fi
          if [ -n "$ADMOB_REWARDED_UNIT_ID" ]; then args+=(-Pseekmind.admob.rewardedUnitId="$ADMOB_REWARDED_UNIT_ID"); fi
          ./gradlew "${args[@]}" :app:bundleAdsRelease :app:verifyAdsReleaseManifest :app:verifyAdsReleaseBundle

      - name: Sign with the upload key
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          REQUIRE_SIGNING: ${{ inputs.require-signing }}
        run: |
          aab=app/build/outputs/bundle/adsRelease/app-ads-release.aab
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::Upload key secrets not set: no unsigned bundle is uploaded."
              exit 1
            fi
            echo "::warning::Upload key secrets not set: the bundle is unsigned and Play will refuse it."
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$keystore"
          jarsigner -keystore "$keystore" -storetype PKCS12 \
            -storepass:env UPLOAD_KEYSTORE_PASSWORD -keypass:env UPLOAD_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$UPLOAD_KEY_ALIAS" > /dev/null
          # -strict: an unsigned or partly signed bundle fails. The keystore makes the upload certificate the
          # trusted one: a bundle signed by any other key fails too.
          jarsigner -verify -strict -keystore "$keystore" -storetype PKCS12 -storepass:env UPLOAD_KEYSTORE_PASSWORD \
            "$aab" > "$RUNNER_TEMP/verify.txt" || {
            echo "::error::The bundle is not signed by the upload key."
            exit 1
          }
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          rm -f "$RUNNER_TEMP/verify.txt"
          echo "Bundle signed by the upload key."

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-ads-release-${{ github.run_number }}
          path: app/build/outputs/bundle/adsRelease/app-ads-release.aab
          if-no-files-found: error
          retention-days: 14
